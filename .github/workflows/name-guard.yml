name: name-guard
# Fails if a pushed commit or a pull request adds a name that must not appear
# in this public repository (tools/name_guard.py). Make it a required check in
# the branch protection rules so that such a change cannot be merged.
on:
  push:
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check added lines and commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
            git cat-file -e "${{ github.sha }}~1" 2>/dev/null || RANGE="${{ github.sha }}"
          fi
          python3 tools/name_guard.py --range "$RANGE"
      - name: Check every tracked file
        run: python3 tools/name_guard.py --tree
